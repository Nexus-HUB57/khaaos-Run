[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=../Distro/Source/
SearchDirectoryPaths=../Distro/Plugins/Online/
SearchDirectoryPaths=../Distro/Plugins/Social/Source/
SearchDirectoryPaths=./Source/Runtime/Online/BuildPatchServices/
SearchDirectoryPaths=./Source/Runtime/SlateCore/Private/Fonts/
SearchDirectoryPaths=./Source/Developer/SuperSearch/
SearchDirectoryPaths=../Distro/Config/
ExcludePathFilters=*/Distro/Config/Localization/*
FileNameFilters=*.cpp
FileNameFilters=*.h
FileNameFilters=*.c
FileNameFilters=*.inl
FileNameFilters=*.mm
FileNameFilters=*.ini

;Write Manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive

;Import localized PO files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource
ResourceName=App.locres

;Export to PO files
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true

[GatherTextStep6]
CommandletClass=GenerateTextLocalizationReport
bConflictReport=true
ConflictReportName=AppConflicts.txt


;Write Text Localization Report
[GatherTextStep7]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
